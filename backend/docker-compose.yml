version: '3.8'

services:
  # ============================================
  # PostgreSQL - основная база данных
  # ============================================
  db:
    image: postgres:15-alpine
    container_name: sks_quest_db
    environment:
      POSTGRES_USER: sks_user
      POSTGRES_PASSWORD: sks_password
      POSTGRES_DB: sks_quest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sks_user -d sks_quest"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis - кеш и rate-limit
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: sks_quest_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # FastAPI - бэкенд приложение
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sks_quest_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://sks_user:sks_password@db:5432/sks_quest
      SECRET_KEY: sks-quest-secret-key-for-hackathon
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # Celery - фоновые задачи (пуши, начисления)
  # ============================================
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sks_quest_celery
    command: celery -A app.tasks worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://sks_user:sks_password@db:5432/sks_quest
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./app:/app/app
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
